name: fleetpy_linux
channels:
  - conda-forge
  - gurobi
dependencies:
  - python=3.9
  - pip
  # Core scientific stack
  - numpy=1.19.5
  - scipy
  - pandas=1.2.0
  - scikit-learn
  - numba

  # GIS stack (modern + Linux-compatible)
  - gdal
  - fiona
  - rasterio
  - geotiff
  - shapely
  - pyproj
  - geopandas
  - rtree

  # Web / API / Frontend
  - flask
  - flask-socketio
  - werkzeug
  - requests

  # Visualization
  - matplotlib
  - contextily

  # Parallel tools
  - dill
  - joblib

  # Jupyter (optional)
  - ipykernel
  - jupyter_core
  - jupyter_client

  # Build & system libs
  - libcurl
  - curl
  - zlib
  - zstd
  - bzip2
  - xz

  # Linear algebra
  - mkl

  # Optimization
  - gurobi

  # QT stack (only PyQt5)
  - pyqt

  # YAML
  - pyyaml

  # Additional utilities
  - tqdm
  - attrs

  # SUMO
  - traci
  - libsumo

  - pip:
      - pyqtwebengine